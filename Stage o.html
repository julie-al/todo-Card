<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            h2 {
              color: blue;
              font-size: 24px;
              margin: 0;
              text-align: center;
              font-weight: bold;
            }
            .description {   
                color: rgb(35, 13, 159);
                font-size: 16px;
                margin: 10px 0;
                text-align: center;
            }
            .time-remaining {
                color: rgb(35, 13, 159);
                font-size: 14px;
                margin: 5px 0;
                text-align: center;
            }
            body {
                background-color: aquamarine;
                border: 2px aquamarine;
                margin: 10px;
                text-align: center;
                padding: 0%;
                width: 100%;
                box-sizing: border-box;
                overflow-x: hidden;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            article {
                width: 100%;
                max-width: 400px;
            }
            span {
                display: block;
                margin: 8px 0;
            }
            label{
                display: block;
                margin: 8px 0;
            }
            .edit-button {
                height: 25px;
                width: 150px;
                max-width: 100%;
                border-radius: 14px;
                font-weight: bold;
                font-size: 13px;
                cursor: pointer;
            }
            .delete-button {
                height: 25px;
                width: 150px;
                max-width: 100%;
                border-radius: 14px;
                font-weight: bold;
                font-size: 13px;
                cursor: pointer;
            }
            button:hover {
                background-color: rgb(250, 162, 0);
            }
            button:active {
                opacity: 0.7;
            }
            [role="list"] {
                display: flex;
                flex-wrap: wrap;
            }
            @media (min-width: 500px) {
                article {
                    width: 100%;
                    padding: 0 10px;
                }
            }

        </style>
    </head>
    <body>
        <article data-testid="test-todo-card">
            <h2 data-testid="test-todo-title">
                Appointments 
            </h2>
            <p class="description" data-testid="test-todo-description">
                Go Shopping with Cece, Doctors Appointment
            </p>
            <strong class="priority" data-testid="test-todo-priority">
                High Priority
            </strong>
            <time data-testid="test-todo-due-date" datetime="2026-04-16T12:00:00">
                Due April 15, 2026
            </time>
            <p class="time-remaining" data-testid="test-todo-time-remaining">
                Due in 1 days 
            </p>
            <span data-testid="test-todo-status">
                Pending
            </span>
            <label  data-testid="test-todo-complete-toggle">
                <input type="checkbox"  id="completeToggle">
                Mark Complete
            </label>
            <div role="list" data-testid="test-todo-tags">
                <div role="listitem" data-testid="test-todo-tag-work">Work</div>
                <div role="listitem" data-testid="test-todo-tag-personal">
                    Personal
                </div>
            </div>
            <button class="edit-button" data-testid="test-todo-edit-button">
                Edit
            </button>
            <button class="delete-button" data-testid="test-todo-delete-button">
                Delete
            </button>
        </article>
        <script>
        const dueDate = new Date ("2026-04-16T21:00:00")
        const now = new Date();
        const diffTime = dueDate - now;
        const Days = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        const hours = Math.floor(diffTime / (1000 * 60 * 60));
        const minutes = Math.floor(diffTime / (1000 * 60));
        let timeRemainingText = "";
        if (Days > 0) {
            timeRemainingText = `Due in ${Days} days`;
        } else if (hours > 0) {
            timeRemainingText = `Due in ${hours} hours`;
        } else if (minutes > 0) {
            timeRemainingText = `Due in ${minutes} minutes`;
        } else {
            timeRemainingText = "Due soon";
        }
        document.querySelector("[data-testid='test-todo-time-remaining']").textContent = timeRemainingText;
        const checkbox = document.querySelector("[data-testid='test-todo-complete-toggle'] input");
        const title = document.querySelector("[data-testid='test-todo-title']");
        const status = document.querySelector("[data-testid='test-todo-status']");
        checkbox.addEventListener("change", () => {
            if (checkbox.checked) {
            title.style.textDecoration = "line-through";
            status.textContent = "Done";}
        });
        const editButton = document.querySelector("[data-testid='test-todo-edit-button']");
        editButton.addEventListener("click", () => {
            console.log("Edit button clicked");
        })
        const deleteButton = document.querySelector("[data-testid='test-todo-delete-button']");
         deleteButton.addEventListener("click", () => {
            console.log("Delete Button clicked");
         });
        </script>
    </body>
</html>
